<!DOCTYPE html>
<html lang="en" data-theme="dark" data-lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BeatSyncToolkit - Documentation</title>
<link rel="stylesheet" href="fonts.css" />
<style>
/* ============================================================
   BeatSyncToolkit Documentation - single-file offline doc
   Design system + i18n engine. Add a language by extending
   the LANGS list and the per-section/per-UI translation keys.
   ============================================================ */
:root{
  --accent:#7c5cff;          /* primary brand violet */
  --accent-2:#21d4fd;        /* cyan companion       */
  --accent-3:#ff5c9d;        /* pink companion       */
  --grad:linear-gradient(120deg,var(--accent),var(--accent-2));
  --grad-soft:linear-gradient(120deg,rgba(124,92,255,.18),rgba(33,212,253,.14));
  --radius:14px;
  --radius-sm:9px;
  --maxw:1080px;
  --sidebar-w:300px;
  --font:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-head:'Syne','Outfit',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code',Consolas,'Courier New',monospace;
}
html[data-theme="dark"]{
  --bg:#0b0d14; --bg-2:#11141f; --bg-3:#161a28; --panel:#12151f;
  --card:#161a27; --card-2:#1b2030;
  --text:#e9ecf5; --text-soft:#aab1c5; --text-dim:#79829a;
  --border:#222838; --border-soft:#1b2030;
  --code-bg:#0e1119; --code-head:#161b29;
  --shadow:0 18px 50px -20px rgba(0,0,0,.7);
}
html[data-theme="light"]{
  --bg:#f6f7fb; --bg-2:#eef1f7; --bg-3:#e7ebf3; --panel:#ffffff;
  --card:#ffffff; --card-2:#f3f5fa;
  --text:#171b26; --text-soft:#454d61; --text-dim:#6b7488;
  --border:#e2e6ef; --border-soft:#eceef4;
  --code-bg:#0e1119; --code-head:#161b29;
  --shadow:0 16px 40px -22px rgba(40,50,90,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 600px at 78% -8%,rgba(124,92,255,.16),transparent 60%),
    radial-gradient(900px 500px at 8% 8%,rgba(33,212,253,.10),transparent 55%);
}
a{color:inherit;text-decoration:none}
[hidden]{display:none !important}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;
  height:64px;padding:0 22px;backdrop-filter:blur(14px);
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.3px;font-size:18px}
.brand .logo{
  width:30px;height:30px;border-radius:9px;background:var(--grad);
  display:grid;place-items:center;box-shadow:0 6px 18px -6px var(--accent);
  position:relative;flex:none;
}
.brand .logo span{display:flex;gap:2px;align-items:flex-end}
.brand .logo span i{display:block;width:3px;border-radius:2px;background:#fff;animation:eq 1.1s ease-in-out infinite}
.brand .logo span i:nth-child(1){height:8px;animation-delay:0s}
.brand .logo span i:nth-child(2){height:14px;animation-delay:.15s}
.brand .logo span i:nth-child(3){height:6px;animation-delay:.3s}
.brand .logo span i:nth-child(4){height:11px;animation-delay:.45s}
@keyframes eq{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.wm{font-family:var(--font-head);font-weight:800;letter-spacing:-.6px;font-size:21px;line-height:1}
.wm-l{color:var(--text)}
.wm-a{color:var(--accent)}
html[data-theme="dark"] .wm-a{color:#7c83ff}
.brand .ver{font-size:11px;font-weight:600;color:var(--text-dim);
  border:1px solid var(--border);padding:2px 7px;border-radius:20px;margin-left:2px}
.topbar .spacer{flex:1}
.tb-search{position:relative;display:flex;align-items:center}
.tb-search input{
  width:210px;max-width:40vw;background:var(--card);border:1px solid var(--border);
  color:var(--text);border-radius:30px;padding:9px 14px 9px 34px;font-size:13.5px;font-family:var(--font);
  transition:.2s;
}
.tb-search input:focus{outline:none;border-color:var(--accent);width:250px}
.tb-search svg{position:absolute;left:11px;width:15px;height:15px;color:var(--text-dim)}
.search-popover{
  position:absolute;right:0;top:46px;width:min(430px,70vw);max-height:370px;overflow:auto;
  display:none;padding:8px;background:var(--panel);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow);z-index:70;
}
.search-popover.open{display:block}
.search-result{
  display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--text);
  font-family:var(--font);padding:10px 11px;border-radius:10px;cursor:pointer;transition:.15s;
}
.search-result:hover{background:var(--card-2)}
.search-result span{display:block;font-size:13.5px;font-weight:700;line-height:1.35}
.search-result small{display:block;margin-top:2px;color:var(--text-dim);font-size:11.5px;font-weight:600}
.search-empty{padding:12px 11px;color:var(--text-dim);font-size:13px}
.tb-btn{
  display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:30px;
  background:var(--card);border:1px solid var(--border);color:var(--text-soft);
  font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.2s;
}
.tb-btn:hover{border-color:var(--accent);color:var(--text)}
.tb-btn svg{width:16px;height:16px}
.lang-wrap{position:relative}
.lang-menu{
  position:absolute;right:0;top:46px;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:6px;min-width:170px;box-shadow:var(--shadow);display:none;
}
.lang-menu.open{display:block}
.lang-menu button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;
  color:var(--text-soft);font-family:var(--font);font-size:14px;font-weight:600;
  padding:9px 10px;border-radius:8px;cursor:pointer;
}
.lang-menu button:hover{background:var(--card-2);color:var(--text)}
.lang-menu button.active{color:var(--accent);background:var(--grad-soft)}
.lang-menu .flag{font-size:16px}
.lang-menu .soon{margin-left:auto;font-size:10px;color:var(--text-dim);border:1px solid var(--border);padding:1px 6px;border-radius:10px}
.menu-toggle{display:none}

/* ---------- Layout ---------- */
.layout{display:flex;max-width:1480px;margin:0 auto;align-items:flex-start}
.sidebar{
  position:sticky;top:64px;align-self:flex-start;width:var(--sidebar-w);flex:none;
  height:calc(100vh - 64px);overflow-y:auto;padding:24px 14px 60px 22px;
  border-right:1px solid var(--border);
}
.sidebar::-webkit-scrollbar,.content-scroll::-webkit-scrollbar{width:9px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
.nav-group{margin-bottom:22px}
.nav-group h4{
  font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-dim);
  margin:0 0 8px 12px;font-weight:700;
}
.nav-link{
  display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:9px;
  color:var(--text-soft);font-size:14px;font-weight:500;cursor:pointer;transition:.15s;position:relative;
}
.nav-link:hover{background:var(--card);color:var(--text)}
.nav-link.active{background:var(--grad-soft);color:var(--text);font-weight:600}
.nav-link.active::before{
  content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--grad);
}
.nav-link .lvl{margin-left:auto;width:7px;height:7px;border-radius:50%;flex:none}
.lvl.beginner{background:#39d98a}
.lvl.intermediate{background:#f7b955}
.lvl.advanced{background:#ff6b8a}
.nav-link.hide{display:none}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;padding:0 0 120px}
.content-scroll{max-width:var(--maxw);margin:0 auto;padding:0 40px}
.hero{
  position:relative;margin:34px 0 26px;padding:40px 38px;border-radius:20px;overflow:hidden;
  background:
    radial-gradient(700px 300px at 100% 0,rgba(124,92,255,.22),transparent 60%),
    var(--card);
  border:1px solid var(--border);
}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2)}
.hero h1{font-family:var(--font-head);font-size:44px;line-height:1.06;letter-spacing:-1.4px;margin:12px 0 14px;font-weight:800}
.hero h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--text-soft);font-size:17px;max-width:680px}
.hero .pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:30px;
  background:var(--card-2);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text-soft);
}
.pill svg{width:14px;height:14px;color:var(--accent)}

/* path cards on landing */
.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:8px 0 10px}
.path-card{
  padding:22px;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);
  cursor:pointer;transition:.2s;
}
.path-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.path-card .ico{width:40px;height:40px;border-radius:11px;background:var(--grad-soft);display:grid;place-items:center;margin-bottom:14px}
.path-card .ico svg{width:21px;height:21px;color:var(--accent)}
.path-card h3{font-family:var(--font-head);font-size:17px;margin-bottom:6px;font-weight:700}
.path-card p{font-size:13.5px;color:var(--text-soft);line-height:1.6}

/* ---------- Section ---------- */
.doc-section{padding:30px 0;border-top:1px solid var(--border-soft);scroll-margin-top:84px}
.doc-section.page-hidden{display:none}
.doc-section.page-active{border-top:none}
.doc-section.flash{
  animation:sectionFlash 1.3s ease;
}
@keyframes sectionFlash{
  0%{background:rgba(33,212,253,.12);box-shadow:0 0 0 14px rgba(33,212,253,.08)}
  100%{background:transparent;box-shadow:none}
}
.doc-section:first-of-type{border-top:none}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.sec-head h2{font-family:var(--font-head);font-size:29px;letter-spacing:-.6px;font-weight:800}
.badge{
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  padding:4px 10px;border-radius:30px;border:1px solid transparent;
}
.badge.beginner{color:#39d98a;background:rgba(57,217,138,.12);border-color:rgba(57,217,138,.3)}
.badge.intermediate{color:#f7b955;background:rgba(247,185,85,.12);border-color:rgba(247,185,85,.3)}
.badge.advanced{color:#ff6b8a;background:rgba(255,107,138,.12);border-color:rgba(255,107,138,.3)}
.anchor{margin-left:6px;color:var(--text-dim);opacity:0;transition:.15s;font-weight:400}
.sec-head:hover .anchor{opacity:1}

.doc-section h3{font-family:var(--font-head);font-size:20px;margin:26px 0 10px;letter-spacing:-.3px;font-weight:700}
.doc-section h4{font-size:16px;margin:20px 0 8px;color:var(--text)}
.doc-section p{margin:11px 0;color:var(--text-soft)}
.doc-section ul,.doc-section ol{margin:11px 0 11px 4px;padding-left:22px;color:var(--text-soft)}
.doc-section li{margin:6px 0}
.doc-section strong{color:var(--text);font-weight:650}
.lead{font-size:17.5px;color:var(--text-soft) !important;margin-top:4px !important}

code:not(pre code){
  font-family:var(--mono);font-size:.86em;background:var(--card-2);
  border:1px solid var(--border);border-radius:6px;padding:1.5px 6px;color:var(--accent-2);
}
html[data-theme="light"] code:not(pre code){color:#7c5cff}

/* code blocks */
.code{margin:16px 0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);background:var(--code-bg)}
.code-head{
  display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--code-head);
  border-bottom:1px solid rgba(255,255,255,.05);
}
.code-head .lang{font-size:11px;font-weight:700;letter-spacing:.06em;color:#8b94ad;text-transform:uppercase}
.code-head .copy{
  margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid #2a3145;
  color:#9aa3bd;border-radius:7px;padding:4px 9px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.15s;
}
.code-head .copy:hover{color:#fff;border-color:var(--accent)}
.code-head .copy svg{width:13px;height:13px}
.code pre{margin:0;padding:16px 16px;overflow-x:auto}
.code code{font-family:var(--mono);font-size:13.2px;line-height:1.65;color:#cdd4e6;white-space:pre}
.tok-c{color:#5f6b85;font-style:italic}     /* comment */
.tok-k{color:#c792ea}                        /* keyword */
.tok-t{color:#7fdbca}                        /* type    */
.tok-s{color:#c3e88d}                        /* string  */
.tok-n{color:#f78c6c}                        /* number  */
.tok-m{color:#82aaff}                        /* method  */
.tok-p{color:#89ddff}                        /* punctuation accent */

/* callouts */
.callout{
  display:flex;gap:13px;margin:18px 0;padding:15px 17px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--card);border-left-width:4px;
}
.callout .ic{flex:none;width:22px;height:22px;margin-top:1px}
.callout .ic svg{width:22px;height:22px}
.callout .bd{font-size:14.3px;color:var(--text-soft)}
.callout .bd b{display:block;color:var(--text);margin-bottom:2px;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.callout.tip{border-left-color:var(--accent-2)} .callout.tip .ic{color:var(--accent-2)}
.callout.note{border-left-color:var(--accent)} .callout.note .ic{color:var(--accent)}
.callout.warn{border-left-color:#f7b955} .callout.warn .ic{color:#f7b955}
.callout.crit{border-left-color:#ff6b8a} .callout.crit .ic{color:#ff6b8a}

/* tables */
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--border);border-radius:var(--radius-sm)}
table{width:100%;border-collapse:collapse;font-size:13.8px;min-width:480px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border-soft);vertical-align:top}
th{background:var(--card-2);color:var(--text);font-weight:650;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
td{color:var(--text-soft)}
tr:last-child td{border-bottom:none}
td code{white-space:nowrap}

/* step list */
.steps{counter-reset:s;list-style:none;padding:0;margin:18px 0}
.steps li{position:relative;padding:4px 0 18px 46px;margin:0}
.steps li::before{
  counter-increment:s;content:counter(s);position:absolute;left:0;top:0;
  width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:14px;
}
.steps li::after{content:"";position:absolute;left:14.5px;top:30px;bottom:0;width:1px;background:var(--border)}
.steps li:last-child::after{display:none}
.steps li b{color:var(--text)}

/* in-section tabs */
.doc-tabs{margin:20px 0;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);overflow:hidden}
.tab-list{display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--card-2);border-bottom:1px solid var(--border)}
.tab-list button{
  flex:none;border:1px solid transparent;background:transparent;color:var(--text-soft);
  font-family:var(--font);font-size:13px;font-weight:700;border-radius:9px;
  padding:8px 12px;cursor:pointer;transition:.15s;
}
.tab-list button:hover{color:var(--text);background:var(--card)}
.tab-list button.active{color:var(--text);border-color:var(--accent);background:var(--grad-soft)}
.tab-panel{display:none;padding:20px}
.tab-panel.active{display:block}
.setting-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}
.setting-card{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card-2);padding:14px}
.setting-card h4{margin:0 0 6px;font-size:14px}
.setting-card p{margin:0;color:var(--text-soft);font-size:13.5px;line-height:1.55}
.music-example{border-left:3px solid var(--accent-2);padding:10px 0 10px 14px;margin:14px 0;color:var(--text-soft);background:linear-gradient(90deg,rgba(33,212,253,.08),transparent)}

.kbd{font-family:var(--mono);font-size:12px;background:var(--card-2);border:1px solid var(--border);
  border-bottom-width:2px;border-radius:6px;padding:1px 7px;color:var(--text)}

/* email support card */
.mailcard{display:flex;align-items:center;gap:16px;margin:16px 0;padding:18px 20px;border-radius:var(--radius);background:var(--grad-soft);border:1px solid var(--border)}
.mailcard .mc-ic{width:44px;height:44px;border-radius:12px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 8px 20px -8px var(--accent)}
.mailcard .mc-ic svg{width:22px;height:22px;color:#fff}
.mailcard a{font-family:var(--font-head);font-weight:700;font-size:19px;color:var(--accent);letter-spacing:-.2px;word-break:break-all}
.mailcard a:hover{text-decoration:underline}
.mailcard small{display:block;margin-top:2px;color:var(--text-soft);font-weight:500;font-size:13px;font-family:var(--font)}

/* footer */
.foot{max-width:var(--maxw);margin:40px auto 0;padding:26px 40px;border-top:1px solid var(--border);
  color:var(--text-dim);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.foot .grow{flex:1}
.foot a{color:var(--text-dim);font-weight:600}
.foot a:hover{color:var(--accent)}

/* scroll progress */
.progress{position:fixed;top:0;left:0;height:3px;background:var(--grad);z-index:60;width:0;transition:width .1s}

/* back to top */
.totop{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:50%;
  background:var(--accent);color:#fff;border:none;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 10px 24px -8px var(--accent);opacity:0;pointer-events:none;transition:.25s;z-index:55}
.totop.show{opacity:1;pointer-events:auto}
.totop svg{width:20px;height:20px}

/* responsive */
.scrim{display:none}
@media(max-width:1000px){
  .paths{grid-template-columns:1fr}
  .menu-toggle{display:inline-flex}
  .sidebar{
    position:fixed;top:64px;left:0;z-index:45;background:var(--panel);
    transform:translateX(-105%);transition:transform .25s;width:300px;box-shadow:var(--shadow);
  }
  .sidebar.open{transform:translateX(0)}
  .scrim.show{display:block;position:fixed;inset:64px 0 0;background:rgba(0,0,0,.5);z-index:44}
  .content-scroll{padding:0 22px}
  .hero h1{font-size:32px}
  .tb-search{display:none}
  .setting-grid{grid-template-columns:1fr}
  .tab-panel{padding:16px}
}
@media(max-width:560px){
  .hero{padding:28px 22px}
  .brand .ver{display:none}
  .lbl-txt{display:none}
}
</style>
</head>
<body>
<div class="progress" id="progress"></div>

<header class="topbar">
  <button class="tb-btn menu-toggle" id="menuToggle" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <a class="brand" href="#top">
    <span class="logo"><span><i></i><i></i><i></i><i></i></span></span>
    <span class="wm"><span class="wm-l">Beat</span><span class="wm-a">Sync</span><span class="wm-l">Toolkit</span></span><span class="ver">Unity • v1.0</span>
  </a>
  <div class="spacer"></div>
  <div class="tb-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
    <input type="text" id="search" placeholder="Search…" autocomplete="off"/>
  </div>
  <button class="tb-btn" id="themeBtn" aria-label="Theme">
    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <div class="lang-wrap">
    <button class="tb-btn" id="langBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
